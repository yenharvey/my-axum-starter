[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
aide = { version = "0.15.0", features = [
    "scalar",
    "macros",
    "axum-json",
    "axum-query",
    "axum",
    "axum-form",
    "axum-multipart",
] }
axum = { version = "0.8.9", features = ["macros", "multipart"] }
chrono = { version = "0.4.45", features = ["serde"] }
sea-orm = { workspace = true }
serde = { workspace = true }
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5.3", features = ["buffer"] }
tower-http = { version = "0.7.1", features = [
    "trace",
    "timeout",
    "cors",
    "fs",
    "compression-br",
    "compression-deflate",
    "compression-gzip",
] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
schemars = { workspace = true }
entity = { path = "../entity" }
migration = { path = "../migration" }
serde_json = "1.0.154"
askama = "0.16.1"
thiserror = "2.0.21"
dotenvy = "0.15.7"
anyhow = "1.0.104"
tracing-appender = "0.2.5"
config = "0.15.27"
url = "2.5.8"
base64 = "0.23.1"
deadpool-redis = { version = "0.23.1", features = ["rt_tokio_1", "serde"] }
tower_governor = { version = "0.8.0", features = ["tracing"] }
# 与 tower_governor 依赖的版本保持一致（仅用于限流层的类型签名）
governor = "0.10.4"
validator = { workspace = true }
strum = { workspace = true }
num_enum = { workspace = true }
jsonwebtoken = { version = "11.1.0", features = ["use_pem", "rust_crypto"] }
argon2 = "0.6.0"
indexmap = { version = "2.14.2", features = ["serde"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[workspace]
members = ["app", "entity", "migration", "dev-tools"]
default-members = ["app"]
resolver = "3"

[workspace.package]
authors = ["{{author_name}}"]
license = "MIT"
repository = "https://github.com/{{authors}}/{{project-name}}"

[workspace.dependencies]
sea-orm = { version = "2.0.4", features = [
    "macros",
    "debug-print",
    "with-chrono",
    "with-uuid",
    "runtime-tokio-rustls",
    "sqlx-postgres",
    "with-json",
    "with-time",
] }
serde = { version = "1.0.229", features = ["derive"] }
strum = { version = "0.28.0", features = ["derive"] }
num_enum = "0.7.6"
# 受 aide 0.15 约束，暂不能升级到 schemars 1.x（需等待 aide 0.16 稳定版）
schemars = { version = "0.9.0", features = ["derive", "chrono04", "uuid1"] }
validator = { version = "0.21.0", features = ["derive"] }

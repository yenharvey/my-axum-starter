# 一条命令启动应用 + PostgreSQL + Redis：
#   cp .env.example .env   # 至少填写 JWT_SECRET
#   docker compose up -d --build
#
# 只想在本机用 cargo run 开发时，可以只启动依赖：docker compose up -d postgres redis

services:
  postgres:
    image: postgres:17-alpine
    container_name: my-axum-starter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-my_axum_starter_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-my_axum_starter_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: my-axum-starter-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-app
    container_name: my-axum-starter
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: production
      # 容器内要用服务名访问数据库和 Redis，.env 里指向 localhost 的地址在这里不适用
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-my_axum_starter_db}
      REDIS_URL: redis://redis:6379
    ports:
      - "${APP_SERVER_PORT:-3000}:${APP_SERVER_PORT:-3000}"
    volumes:
      - app_logs:/app/logs
      - ./config:/app/config:ro
      - ./app/assets:/app/app/assets:ro

volumes:
  app_logs:
  postgres_data:
  redis_data:
